name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
          clang --version

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustup component add clippy

      - name: Build
        run: cargo build --locked

      - name: Run tests
        env:
          AUREN_CC: clang
        run: cargo test --locked

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Release build
        run: cargo build --release --locked

      - name: Differential examples
        env:
          AUREN_CC: clang
        run: |
          set -euo pipefail
          for source in examples/*.auren; do
            name="$(basename "$source" .auren)"
            ./target/debug/auren run "$source" > "/tmp/${name}.interp"
            ./target/debug/auren build "$source" -o "/tmp/${name}.native"
            "/tmp/${name}.native" > "/tmp/${name}.native.out"
            diff -u "/tmp/${name}.interp" "/tmp/${name}.native.out"
            echo "ok: $source"
          done
