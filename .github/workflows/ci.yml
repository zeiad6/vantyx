name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
          clang --version

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustup component add clippy rustfmt

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Build
        run: cargo build --locked

      - name: Run tests
        env:
          VANTYX_CC: clang
        run: cargo test --locked

      - name: Differential fuzz
        env:
          VANTYX_CC: clang
        run: python3 tools/differential_fuzz.py --iterations 80 --seed 1

      - name: Streaming smoke
        run: python3 tools/streaming_smoke.py --binary target/debug/vantyx

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Release build
        run: cargo build --release --locked

      - name: Differential examples
        env:
          VANTYX_CC: clang
        run: |
          set -euo pipefail
          for source in examples/*.vtx; do
            name="$(basename "$source" .vtx)"
            ./target/debug/vantyx run "$source" > "/tmp/${name}.interp"
            ./target/debug/vantyx build "$source" -o "/tmp/${name}.native"
            "/tmp/${name}.native" > "/tmp/${name}.native.out"
            diff -u "/tmp/${name}.interp" "/tmp/${name}.native.out"
            echo "ok: $source"
          done
